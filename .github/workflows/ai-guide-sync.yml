name: AI guide sync

# On each release (a v* tag), regenerates the Countdown AI's guides in damurka/countdown-analytics against this
# version of cd2030.core (its CacheConnection members and report kinds, via cache_manifest()) and opens a pull
# request there. Entries a person reviewed keep their text; new members come in as drafts to review.
# (countdown-analytics docs/AI-PLAN.md section 3.)
#
# Needs the repository secret COUNTDOWN_ANALYTICS_TOKEN: a fine-grained token with Contents and Pull requests
# read/write on damurka/countdown-analytics.
#
# The second job (methodology-docs) regenerates the methodology constants the DataSuite docs quote
# (cd_methodology_defaults(), written by inst/scripts/export-methodology-defaults.R) into
# docs-site/src/data/methodology-defaults.json of damurka/datasuite-identity and opens a pull request there, against
# main (the file's version and generatedAt change with every release, so there is always one to review). The docs
# are that repository's docs-site/ (its deploy/README.md: "the source of truth for the docs"); they were the
# standalone aphrcwaro/datasuite-docs, which is no longer what is built.
# It needs the repository secret DATASUITE_DOCS_TOKEN: a fine-grained token with Contents and Pull requests
# read/write on damurka/datasuite-identity. The two jobs are independent: one failing does not stop the other.
#
# A job whose secret is not set is skipped, with a notice saying so (the first job looks): without it the
# checkout of the other repository failed ("Input required and not supplied: token") and every release was red.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.have.outputs.analytics }}
      docs: ${{ steps.have.outputs.docs }}
    steps:
      - id: have
        env:
          ANALYTICS: ${{ secrets.COUNTDOWN_ANALYTICS_TOKEN }}
          DOCS: ${{ secrets.DATASUITE_DOCS_TOKEN }}
        run: |
          if [ -n "$ANALYTICS" ]; then echo "analytics=true" >> "$GITHUB_OUTPUT"; else echo "::notice::COUNTDOWN_ANALYTICS_TOKEN is not set: the AI guides are not synced."; fi
          if [ -n "$DOCS" ]; then echo "docs=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATASUITE_DOCS_TOKEN is not set: the methodology constants are not synced."; fi

  sync:
    needs: tokens
    if: needs.tokens.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cd2030.core
      - uses: actions/checkout@v7
        with:
          repository: damurka/countdown-analytics
          token: ${{ secrets.COUNTDOWN_ANALYTICS_TOKEN }}
          path: countdown-analytics
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries (sf's udunits, GDAL, GEOS and PROJ; the CRAN binaries load them)
        run: sudo apt-get update -q && sudo apt-get install -y -q libudunits2-dev libgdal-dev libgeos-dev libproj-dev
      - name: Install this cd2030.core (and datasuite.ui from r-universe)
        run: |
          Rscript -e 'install.packages(c("datasuite.ui", "remotes", "jsonlite"), repos = c("https://damurka.r-universe.dev", "https://alkemalab.r-universe.dev", getOption("repos")))'
          Rscript -e 'remotes::install_local("cd2030.core", dependencies = TRUE, upgrade = "never", repos = c("https://damurka.r-universe.dev", "https://alkemalab.r-universe.dev", getOption("repos")))'
      - name: Regenerate the guides
        working-directory: countdown-analytics
        run: Rscript scripts/generate-ai-guide.R --corpus ai/corpus.json
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: countdown-analytics
          token: ${{ secrets.COUNTDOWN_ANALYTICS_TOKEN }}
          branch: ai-guide/cd2030.core-${{ github.ref_name }}
          commit-message: "Update the AI guides for cd2030.core ${{ github.ref_name }}"
          title: "AI guides for cd2030.core ${{ github.ref_name }}"
          body: |
            Regenerated `ai/cache-guide.json` and `ai/report-kinds.json` against cd2030.core ${{ github.ref_name }}
            (`scripts/generate-ai-guide.R`). Removed members are dropped and changed arguments updated; new members
            come in with `status: "draft"` -- review their group and question, then set `status: "reviewed"`.

  methodology-docs:
    needs: tokens
    if: needs.tokens.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cd2030.core
      - uses: actions/checkout@v7
        with:
          repository: damurka/datasuite-identity
          ref: main
          token: ${{ secrets.DATASUITE_DOCS_TOKEN }}
          path: datasuite-identity
          # only the docs: the repository is large, and nothing else of it is read or changed
          sparse-checkout: docs-site/src/data
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries (sf's udunits, GDAL, GEOS and PROJ; the CRAN binaries load them)
        run: sudo apt-get update -q && sudo apt-get install -y -q libudunits2-dev libgdal-dev libgeos-dev libproj-dev
      - name: Install this cd2030.core (and datasuite.ui from r-universe)
        run: |
          Rscript -e 'install.packages(c("datasuite.ui", "remotes", "jsonlite"), repos = c("https://damurka.r-universe.dev", "https://alkemalab.r-universe.dev", getOption("repos")))'
          Rscript -e 'remotes::install_local("cd2030.core", dependencies = TRUE, upgrade = "never", repos = c("https://damurka.r-universe.dev", "https://alkemalab.r-universe.dev", getOption("repos")))'
      - name: Regenerate the methodology constants
        run: Rscript cd2030.core/inst/scripts/export-methodology-defaults.R datasuite-identity/docs-site/src/data/methodology-defaults.json
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: datasuite-identity
          token: ${{ secrets.DATASUITE_DOCS_TOKEN }}
          base: main
          branch: methodology-defaults/cd2030.core-${{ github.ref_name }}
          add-paths: docs-site/src/data/methodology-defaults.json
          commit-message: "Update the methodology constants for cd2030.core ${{ github.ref_name }}"
          title: "Methodology constants for cd2030.core ${{ github.ref_name }}"
          body: |
            Regenerated `docs-site/src/data/methodology-defaults.json` from `cd_methodology_defaults()` in cd2030.core
            ${{ github.ref_name }} (`inst/scripts/export-methodology-defaults.R`). These are the values the package
            runs with; check the pages that quote a changed value.
